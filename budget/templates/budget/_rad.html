{% load kr %}<tr class="{{ klass }}">
  <td>{% if r.url %}<a href="{{ r.url }}">{{ r.namn }}</a>{% else %}{{ r.namn }}{% endif %}</td>
  <td class="tal dimmad">{{ r.b_man|kr:0 }}</td><td class="tal">{{ r.u_man|kr:0 }}</td>
  <td class="tal {% if r.d_man < 0 %}over{% elif r.d_man > 0 %}under{% endif %}">{{ r.d_man|kr:0 }}</td>
  <td class="tal dimmad">{{ r.b_hit|kr:0 }}</td><td class="tal">{{ r.u_hit|kr:0 }}</td>
  <td class="tal {% if r.d_hit < 0 %}over{% elif r.d_hit > 0 %}under{% endif %}">{{ r.d_hit|kr:0 }}</td>
  <td class="tal dimmad">{{ r.b_ar|kr:0 }}</td>
</tr>
